<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geoportal Regional da AMESC — 15 Municípios do Extremo Sul Catarinense (SC)</title>
  <link rel="icon" type="image/png" href="assets/favicon-geolab.png?v=2" />
  <meta name="description" content="Geoportal Integrado dos 15 Municípios da AMESC (Extremo Sul Catarinense — SC): Mosaico regional conectado com seleção individual por município, IBGE Censo 2022, FBDS 1:5.000, SGB/CPRM (Riscos e RIGeo), IMA-SC, SIGSC Ortofoto 2012, DNIT, IPHAN, INCRA/SIGEF, ANEEL, DataSUS/CNES e OpenStreetMap." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="css/geoportal.css" />
</head>
<body>
  <!-- ========================= CABEÇALHO SUPERIOR ========================= -->
  <header class="gp-header">
    <div class="gp-brand-group">
      <a href="#map" class="gp-logo-link" id="logoHomeLink" title="Geoportal Regional da AMESC — 15 Municípios (SC)">
        <img
          src="assets/logo-geoportal.png"
          alt="Geoportal"
          style="height:28px;width:auto;object-fit:contain;display:block"
        />
      </a>

      <div class="gp-brand-divider" aria-hidden="true"></div>

      <div class="gp-municipal-lockup" title="AMESC — Associação dos Municípios do Extremo Sul Catarinense">
        <img
          src="assets/logo-amesc-oficial.png"
          alt="Logo Oficial AMESC — Associação dos Municípios do Extremo Sul Catarinense"
          style="height:34px;width:auto;object-fit:contain;display:block"
        />
      </div>
    </div>

    <div class="gp-mun-select-wrap" title="Selecionar município da AMESC ou ver o mosaico completo">
      <label for="headerMunSelect">Município:</label>
      <select id="headerMunSelect" class="gp-mun-select">
        <option value="ALL">Todos os 15 (Mosaico AMESC)</option>
      </select>
    </div>

    <button class="gp-mobile-menu-btn" id="btnMobileMenu" aria-label="Menu de navegação">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <nav class="gp-nav" id="mainNav" aria-label="Navegação Principal">
      <button class="gp-nav-btn" data-nav="home">Início</button>
      <button class="gp-nav-btn active" data-nav="map">Mapas Interativos</button>
      <button class="gp-nav-btn" data-nav="municipios">15 Municípios</button>
      <button class="gp-nav-btn highlight-doc" data-nav="socio">Painel Socioeconômico</button>
      <a class="gp-nav-btn" href="downloads.html" target="_blank" rel="opener" style="text-decoration:none">Download ↗</a>
      <button class="gp-nav-btn" data-nav="help">Ajuda</button>
    </nav>
  </header>

  <!-- ========================= ESPAÇO DO MAPA ========================= -->
  <main class="gp-workspace" id="workspace">
    <div id="map" role="application" aria-label="Mapa Interativo da Região da AMESC"></div>

    <!-- Cortina Temporal -->
    <div class="gp-swipe-divider" id="swipeDivider" title="Arraste para comparar levantamentos">
      <span class="gp-swipe-tag left" id="swipeTagLeft">Satélite HD</span>
      <span class="gp-swipe-tag right" id="swipeTagRight">Orto SC 2012</span>
      <div class="gp-swipe-handle">⇄</div>
    </div>

    <!-- Banner de Modo Interativo -->
    <div class="gp-mode-banner" id="modeBanner">
      <span id="modeBannerText">Modo ativo</span>
      <button class="gp-mode-cancel" id="btnModeCancel">Sair (ESC)</button>
    </div>

    <!-- Busca Unificada -->
    <div class="gp-search-wrap">
      <div class="gp-search-bar" id="searchBar">
        <button class="gp-search-toggle" id="btnSearchToggle" title="Buscar Município, Bairro, Distrito, Localidade, Rua, Rodovia, Escola, Saúde, Sítio IPHAN ou Coordenada">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M21 21l-4.35-4.35"></path>
          </svg>
        </button>
        <input
          type="text"
          id="searchInput"
          class="gp-search-input"
          placeholder="Município, bairro, localidade, rua, rodovia, saúde, risco..."
          autocomplete="off"
        />
        <button class="gp-search-clear" id="btnSearchClear" title="Limpar busca">×</button>
      </div>
      <div class="gp-search-results" id="searchResults"></div>
    </div>

    <!-- Barra Lateral Esquerda -->
    <aside class="gp-left-toolbar" aria-label="Controles de Navegação do Mapa">
      <button class="gp-tool-btn" id="btnCrsInfo" title="Alternar Sistema de Coordenadas (SIRGAS 2000 UTM 22S / WGS84 / DMS)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      </button>
      <button class="gp-tool-btn" id="btnBoxZoom" title="Zoom por Retângulo">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.5-4.5M8 10.5h5M10.5 8v5"/></svg>
      </button>
      <button class="gp-tool-btn" id="btnZoomIn" title="Aproximar (+)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="gp-tool-btn" id="btnZoomOut" title="Afastar (−)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14"/></svg>
      </button>
      <button class="gp-tool-btn active" id="btnPan" title="Mover Mapa (Pan)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/></svg>
      </button>
      <button class="gp-tool-btn" id="btnHome" title="Extensão Inicial da Região AMESC (15 Municípios)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5.5v-6.5h-5V21H4a1 1 0 0 1-1-1v-9.5z"/></svg>
      </button>
      <button class="gp-tool-btn" id="btnUndo" title="Vista Anterior" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
      </button>
      <button class="gp-tool-btn" id="btnRedo" title="Próxima Vista" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
      </button>
      <button class="gp-tool-btn" id="btnFullscreen" title="Tela Cheia">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      </button>
      <button class="gp-tool-btn" id="btnLocate" title="Minha Localização (GPS)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
      </button>
    </aside>

    <!-- Barra Vertical Direita de Ferramentas GIS -->
    <aside class="gp-right-toolbar" aria-label="Ferramentas Geográficas">
      <button class="gp-tool-btn active" id="btnToolLayers" title="Abrir/Recolher Controle de Camadas e 15 Municípios">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 12l10 5 10-5"/><path d="M2 17l10 5 10-5"/></svg>
      </button>
      <button class="gp-tool-btn" data-panel="basemaps" title="Mapas Base, Satélite HD, Ortofoto SC 2012, Relevo MDT e Cortina">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="6" height="6" fill="currentColor"/><rect x="15" y="3" width="6" height="6" fill="currentColor"/>
          <rect x="9" y="9" width="6" height="6" fill="currentColor"/>
          <rect x="3" y="15" width="6" height="6" fill="currentColor"/><rect x="15" y="15" width="6" height="6" fill="currentColor"/>
          <rect x="3" y="3" width="18" height="18" rx="1.5"/>
        </svg>
      </button>
      <button class="gp-tool-btn" data-panel="print" title="Imprimir / Exportar Mapa em PDF">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      </button>
      <button class="gp-tool-btn" data-panel="measure" title="Medir Distância e Área">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M21.3 8.7l-6-6a1 1 0 0 0-1.4 0L2.7 13.9a1 1 0 0 0 0 1.4l6 6a1 1 0 0 0 1.4 0L21.3 10.1a1 1 0 0 0 0-1.4z"/><path d="M7.5 9.5l2 2M10.5 6.5l2 2M13.5 3.5l2 2M4.5 12.5l2 2"/></svg>
      </button>
      <button class="gp-tool-btn" data-panel="draw" title="Desenhar, Anotar e Exportar GeoJSON">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </button>
      <button class="gp-tool-btn" data-panel="identify" title="Identificar Feições (Raio-X Territorial do Ponto)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 16v-5M12 8h.01"/></svg>
      </button>
      <button class="gp-tool-btn" data-panel="import" title="Importar Shapefile (.zip) / GeoJSON / KML e Exportar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15l3-3 3 3"/></svg>
      </button>
      <button class="gp-tool-btn" data-panel="select" title="Diagnóstico Territorial Rápido">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M18 11V6a2 2 0 0 0-4 0v4"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-5.9-2.3L3.3 17a2 2 0 0 1 2.8-2.8L8 16"/></svg>
      </button>
    </aside>

    <!-- Painel Flutuante -->
    <section class="gp-floating-panel" id="floatingPanel" aria-live="polite">
      <div class="gp-fp-header">
        <span id="fpTitle">Ferramenta</span>
        <button class="gp-fp-close" id="fpClose" title="Fechar painel">×</button>
      </div>
      <div class="gp-fp-body" id="fpBody"></div>
    </section>

    <!-- Painel Direito: Controle de Camadas & 15 Municípios -->
    <aside class="gp-drawer" id="layerDrawer" aria-label="Controle de Camadas">
      <div class="gp-drawer-header">
        <span class="gp-drawer-title">Controle de Camadas — AMESC</span>
        <div class="gp-drawer-header-actions">
          <button class="gp-drawer-icon-btn" id="btnDrawerMin" title="Recolher painel">■</button>
          <button class="gp-drawer-icon-btn" id="btnDrawerClose" title="Fechar painel">×</button>
        </div>
      </div>

      <div class="gp-drawer-search-box">
        <input
          type="text"
          id="layerSearchInput"
          class="gp-drawer-search-input"
          placeholder="Buscar Grupo, Camada ou Município"
          autocomplete="off"
        />
      </div>

      <div class="gp-drawer-subbar">
        <div class="gp-drawer-tabs">
          <button class="gp-tab-pill active" id="tabLayers"><span id="activeLayerCount">Camadas (3)</span></button>
          <button class="gp-tab-pill" id="tabMunicipios"><span>Municípios (15)</span></button>
          <button class="gp-tab-pill" id="tabOrder"><span id="orderLayerCount">Ordem (3)</span></button>
          <button class="gp-tab-pill" id="tabLegend">Legenda</button>
        </div>
        <button class="gp-clear-layers-btn" id="btnClearLayers" title="Desmarcar todas as camadas vetoriais">Limpar</button>
      </div>

      <div class="gp-drawer-body" id="drawerBody"></div>
    </aside>

    <!-- Legenda Flutuante Dinâmica -->
    <aside class="gp-map-legend-box" id="mapLegendBox" aria-label="Legenda das Camadas Ativas">
      <div class="gp-map-legend-head" id="mapLegendToggle" title="Clique para recolher ou expandir a legenda">
        <span id="mapLegendTitle">Legenda Ativa</span>
        <span id="mapLegendChevron">▾</span>
      </div>
      <div class="gp-map-legend-body" id="mapLegendBody"></div>
    </aside>

    <!-- Barra de Status Inferior -->
    <div class="gp-statusbar" id="statusBar">
      <span id="statusCoordsText">628500,000  6795000,000</span>
      <select class="gp-status-select" id="statusCrsSelect" title="Sistema de Coordenadas">
        <option value="utm" selected>UTM 22S</option>
        <option value="wgs84">WGS84</option>
        <option value="dms">DMS</option>
      </select>
      <span class="gp-status-sep"></span>
      <div class="gp-scale-bar-wrap">
        <div class="gp-scale-line" id="statusScaleLine">10 km</div>
      </div>
      <span class="gp-status-sep"></span>
      <select class="gp-status-select" id="statusScaleSelect" title="Escala Cartográfica">
        <option value="2500">1 : 2.500</option>
        <option value="5000">1 : 5.000</option>
        <option value="10000">1 : 10.000</option>
        <option value="25000">1 : 25.000</option>
        <option value="50000">1 : 50.000</option>
        <option value="100000">1 : 100.000</option>
        <option value="250000">1 : 250.000</option>
        <option value="500000">1 : 500.000</option>
      </select>
    </div>
  </main>

  <!-- ========================= MODAL DE NAVEGAÇÃO ========================= -->
  <div class="gp-modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="gp-modal">
      <div class="gp-modal-head">
        <h2 id="modalTitle">Geoportal Regional da AMESC</h2>
        <button class="gp-drawer-icon-btn" id="modalClose" title="Fechar (ESC)">×</button>
      </div>
      <div class="gp-modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="gp-toast-wrap" id="toastWrap"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/shpjs@4.0.4/dist/shp.min.js" defer></script>

  <script src="js/limite-amesc.js?v=20261127-3"></script>
  <script src="js/indicadores-amesc.js?v=20261127-3"></script>
  <script src="js/amesc-bundle.js?v=20261127-3"></script>
  <script src="js/coords.js?v=20261127-3"></script>
  <script src="js/catalog.js?v=20261127-3"></script>
  <script src="js/metadata.js?v=20261127-3"></script>
  <script src="js/layer-engine.js?v=20261127-3"></script>
  <script src="js/tools.js?v=20261127-3"></script>
  <script src="js/app.js?v=20261127-3"></script>
</body>
</html>
